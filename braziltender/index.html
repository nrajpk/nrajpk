<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MEVA Collaborative Tender System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Georama:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* =====================================================
1. BRAND TOKENS
===================================================== */

:root {
  --brand-color: #E41837;
  --brand-hover: #c91430;
  --text-main: #1A1A1B;
  --text-muted: #5F6368;
  --border-color: #DADCE0;
  --bg-gray: #F8F9FA;
  --app-bg: #1f2937;
}


/* =====================================================
2. GLOBAL SETTINGS
===================================================== */

body{
  font-family:'Georama',sans-serif;
  margin:0;
  padding-top:60px;
  background:var(--app-bg);
  color:var(--text-main);
  line-height:1.5;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
  counter-reset:sheet;
}


/* =====================================================
3. APP TOOLBAR
===================================================== */

.app-toolbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  background:#fff;
  border-bottom:1px solid var(--border-color);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  z-index:1000;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.app-brand{
  font-size:16px;
  font-weight:800;
  color:var(--text-main);
  display:flex;
  align-items:center;
  gap:10px;
}

.app-brand span{
  color:var(--brand-color);
}

.toolbar-actions{
  display:flex;
  align-items:center;
  gap:16px;
}

.sync-status{
  font-size:13px;
  font-weight:600;
  color:var(--text-muted);
  transition:color .2s;
}

.sync-status.dirty{
  color:#d97706;
}


/* =====================================================
4. BUTTONS
===================================================== */

.btn{
  background:#fff;
  border:1px solid var(--border-color);
  color:var(--text-main);
  padding:8px 16px;
  font-family:'Georama',sans-serif;
  font-weight:800;
  font-size:12px;
  text-transform:uppercase;
  border-radius:6px;
  cursor:pointer;
  transition:all .2s;
}

.btn:hover{
  background:var(--bg-gray);
}

.btn-primary{
  background:var(--brand-color);
  color:#fff;
  border-color:var(--brand-color);
}

.btn-primary:hover{
  background:var(--brand-hover);
}

.btn-primary:disabled{
  opacity:.5;
  cursor:not-allowed;
}


/* =====================================================
5. WEB PAGE PREVIEW
===================================================== */

@media screen{

  .pdf-page{
    width:210mm;
    min-height:297mm;
    margin:30px auto;
    background:#fff;
    display:flex;
    flex-direction:column;
    padding:15mm 10mm;
    box-sizing:border-box;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    position:relative;
    border-radius:4px;
  }

  .page-footer{
    display:none !important;
  }

}


/* =====================================================
6. PRINT LAYOUT
===================================================== */

@page{
  size:A4;
  margin:0;
}

@media print{

  .app-toolbar,
  .ui-controls,
  .doc-controls-wrapper,
  #remote-banner,
  #status-toast,
  .section-lock-btn,
  .resizer{
    display:none !important;
  }

  html,body{
    background:#fff !important;
    padding:0 !important;
    margin:0 !important;
  }

  .pdf-page{
    width:210mm !important;
    height:auto !important;
    min-height:0 !important;
    margin:0 !important;
    padding:15mm 10mm !important;
    box-sizing:border-box !important;
    box-shadow:none !important;
    border-radius:0 !important;
    display:block !important;
    page-break-after:always !important;
    break-after:page !important;
  }

  .page-content{
    display:block !important;
    padding-bottom:18mm !important;
    box-sizing:border-box !important;
  }

  .page-footer{
    display:flex !important;
    position:fixed !important;
    bottom:10mm !important;
    left:10mm !important;
    right:10mm !important;
  }

  thead{
    display:table-header-group !important;
  }

  tr{
    page-break-inside:avoid !important;
    break-inside:avoid !important;
  }

  .main-heading,
  .sub-heading,
  .vol-identifier{
    page-break-after:avoid !important;
    break-after:avoid !important;
  }

}


/* =====================================================
7. TYPOGRAPHY
===================================================== */

.page-content{
  display:block;
  overflow:visible;
  box-sizing:border-box;
  padding-bottom:4mm;
}

.vol-identifier{
  font-size:11.5px;
  font-weight:800;
  color:var(--brand-color);
  text-transform:uppercase;
  letter-spacing:1px;
  padding:0 0 6px 0;
  border-bottom:3px solid var(--brand-color);
  margin-bottom:16px;
  display:block;
}

.main-heading{
  font-size:14px;
  font-weight:800;
  color:var(--text-main);
  margin-bottom:12px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.sub-heading{
  font-size:11px;
  font-weight:700;
  color:var(--brand-color);
  text-transform:uppercase;
  letter-spacing:1px;
  border-bottom:1px solid var(--border-color);
  padding-bottom:6px;
  margin:24px 0 12px 0;
}

p.para{
  font-size:12px;
  color:var(--text-main);
  line-height:1.45;
  margin:0 0 14px 0;
  text-align:justify;
}

p.para em{
  font-style:italic;
  color:var(--text-muted);
  font-size:11px;
  display:inline-block;
  margin-top:4px;
}

p.para strong{
  font-weight:800;
  color:var(--brand-color);
}


/* =====================================================
8. TABLES
===================================================== */

table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:8px;
  font-size:11px;
}

th,td{
  border:1px solid var(--border-color);
  padding:10px 8px;
  text-align:left;
  vertical-align:top;
}

th{
  background:var(--bg-gray);
  font-weight:700;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.5px;
  font-size:10px;
}

.group-header{
  background:#fff !important;
  text-align:left;
  font-weight:800;
  color:var(--brand-color);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:1px;
  padding-top:24px !important;
  padding-bottom:6px !important;
  border:1px solid var(--border-color) !important;
  border-bottom:1.5pt solid var(--brand-color) !important;
}

tbody tr:last-child td{
  border-bottom:none;
}


/* =====================================================
9. TABLE RESIZER
===================================================== */

.resizer{
  position:absolute;
  top:0;
  right:0;
  width:5px;
  cursor:col-resize;
  user-select:none;
  height:100%;
  z-index:1;
}

.resizer:hover,
.resizing{
  border-right:2px solid var(--brand-color);
}


/* =====================================================
10. EDITOR UI
===================================================== */

.doc-controls-wrapper{
  display:inline-flex;
  background:var(--bg-gray);
  border:1px solid var(--border-color);
  border-radius:6px;
  overflow:hidden;
  opacity:.2;
  transition:all .3s ease;
  margin-bottom:16px;
  user-select:none;
}

.doc-controls-wrapper:hover,
.doc-controls-wrapper:focus-within{
  opacity:1;
}

.doc-control{
  background:transparent;
  border:none;
  border-right:1px solid var(--border-color);
  color:var(--text-muted);
  padding:6px 12px;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  cursor:pointer;
}

.doc-control:last-child{
  border-right:none;
}

.doc-control:hover{
  background:#e5e7eb;
  color:var(--text-main);
}


/* =====================================================
11. HEADER + FOOTER
===================================================== */

.header{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 0 8px 0;
  border-bottom:.5pt solid var(--border-color);
  margin-bottom:20px;
}

.logo-container img{
  height:28px;
  width:auto;
  object-fit:contain;
}

.page-footer{
  flex-shrink:0;
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-top:.5pt solid var(--border-color);
  padding-top:6px;
}

.page-footer-text,
.page-num{
  font-size:7.5pt;
  color:var(--text-muted);
  font-weight:600;
  white-space:nowrap;
}

</style>
</head>
<body>

<div class="app-toolbar">
  <div class="app-brand">MEVA <span>Tender Builder</span></div>
  
    <div class="doc-controls-wrapper" id="meva-toolbar" style="opacity:1; margin:0;">
  <!-- Text -->
  <button class="doc-control" type="button" data-act="bold" title="Bold"><b>B</b></button>
  <button class="doc-control" type="button" data-act="italic" title="Italic"><i>I</i></button>
  <button class="doc-control" type="button" data-act="underline" title="Underline"><u>U</u></button>
      <button class="doc-control" type="button" id="color-btn" title="Text Color">A🎨</button>
<input type="color" id="color-picker" style="display:none;">
 <!--   <button class="doc-control" type="button" data-act="ul" title="Bullets">• List</button> -->
 <!--   <button class="doc-control" type="button" data-act="ol" title="Numbered">1. List</button> -->
      <button class="doc-control" type="button" data-act="clear">Clear</button>
<div>

  <button class="doc-control" type="button" data-act="row-above" title="Row Above">Row ↑</button>

  <button class="doc-control" type="button" data-act="col-right" title="Column Right">+Col →</button>

</div>

  <button class="doc-control" type="button" data-act="deepdive" title="Deep Dive Row">Deep Dive</button>
</div>
    <div class="toolbar-actions">
    <span id="sync-status" style="font-size:12px; font-weight:600; color:var(--text-muted);">Status: Ready</span>
  <!--  <button class="btn" onclick="window.takeSnapshot()">📸 Snapshot</button> -->
    <button class="btn" onclick="window.print()">🖨️ PDF</button>
    <button class="btn btn-primary" id="save-btn" onclick="saveData()" disabled>☁️ Sync to Cloud</button>

  </div>
</div>

<div id="status-toast"></div>
<div id="document-content" contenteditable="true" spellcheck="false"></div>

<script type="module">
  // 1. HARDCODED SKELETON (Replaces seed-data.js)
  const MEVA_SKELETON = `
    
    `;

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction, serverTimestamp, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAnkigLELyqqE8yHMrTF2RZ0IxbCoRhpAk",
    authDomain: "brazil-tender-6d171.firebaseapp.com",
    projectId: "brazil-tender-6d171",
    storageBucket: "brazil-tender-6d171.firebasestorage.app",
    messagingSenderId: "645077728018",
    appId: "1:645077728018:web:13a6fe63f85442e35e91cb",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const docRef = doc(db, 'tender_documents', 'meva_main_html');

  const contentDiv = document.getElementById('document-content');
  const saveBtn = document.getElementById('save-btn');
  const syncStatus = document.getElementById('sync-status');

  let currentRev = 0, dirty = false, applyingRemote = false, canSync = false, listenerUnsub = null;

  function showToast(msg) { const t = document.getElementById('status-toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }

  function setDirty(isDirty) {
    if (applyingRemote) return;
    dirty = isDirty;
    syncStatus.textContent = dirty ? "Unsaved changes" : "All changes saved";
    saveBtn.disabled = !canSync || !dirty;
  }

  function renderFromRemote(html, rev) {
    applyingRemote = true;
    if (!html || html.trim() === "") {
        contentDiv.innerHTML = MEVA_SKELETON;
    } else if (!html.includes('class="page"')) {
        contentDiv.innerHTML = MEVA_SKELETON.replace('<p style="color:#5F6368">Click here to start editing spec tables...</p>', html);
    } else {
        contentDiv.innerHTML = html;
    }
    applyingRemote = false;
    currentRev = Number(rev || 0);
    setDirty(false);
  }

  function setBlocked(blocked) {
    contentDiv.setAttribute('contenteditable', blocked ? 'false' : 'true');
    contentDiv.style.pointerEvents = blocked ? 'none' : 'auto';
    contentDiv.style.opacity = blocked ? '0.5' : '1';
  }

  async function isAllowlistedEmail(user) {
    if (!user?.email) return false;
    const snap = await getDoc(doc(db, 'allowlist_emails', user.email));
    return snap.exists() && snap.data()?.enabled === true;
  }

  function ensureLoginModal() {
    if (document.getElementById('meva-login-overlay')) return;
    const overlay = document.createElement('div');
    overlay.id = 'meva-login-overlay';
    overlay.style.cssText = `position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; font-family:Georama, sans-serif;`;
    overlay.innerHTML = `<div style="width:380px; background:#fff; border-radius:10px; padding:25px; box-shadow:0 10px 40px rgba(0,0,0,0.5);">
      <div style="font-weight:900; color:var(--brand-color); margin-bottom:15px; text-align:center;">MEVA TENDER DOC BUILDER</div>
      <div style="font-size:11px; color:#6b7280; text-align:center; margin-bottom:12px;">
  Username / Email: Official Email ID<br>
  Password: meva2026
</div>
      <input id="m-email" type="email" placeholder="Email" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
      <input id="m-pass" type="password" placeholder="Password" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
      <button id="m-btn" style="width:100%; padding:12px; background:var(--brand-color); color:#fff; border:none; border-radius:6px; font-weight:800; cursor:pointer;">SIGN IN</button>
      <div id="m-msg" style="color:red; font-size:11px; margin-top:10px; text-align:center;"></div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#m-btn').onclick = async () => {
      const e = document.getElementById('m-email').value, p = document.getElementById('m-pass').value;
      try { await signInWithEmailAndPassword(auth, e, p); } catch { document.getElementById('m-msg').textContent = "Access Denied."; }
    };
  }

  window.saveData = async () => {
    if (!canSync || !dirty) return;
    saveBtn.textContent = '⏳ Syncing...';
    try {
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(docRef);
        const sRev = snap.exists() ? Number(snap.data().rev || 0) : 0;
        if (sRev !== currentRev) throw new Error('CONFLICT');
        tx.set(docRef, { htmlContent: contentDiv.innerHTML, rev: sRev + 1, updatedAt: serverTimestamp(), updatedBy: auth.currentUser.email });
        currentRev = sRev + 1;
      });
      setDirty(false); showToast('☁️ Saved');
    } catch { showToast('Sync Conflict! Please reload.'); }
    finally { saveBtn.textContent = '☁️ Sync to Cloud'; }
  };

  window.takeSnapshot = async () => {
    const name = prompt("Milestone Name:"); if (!name) return;
    try {
      await setDoc(doc(collection(db, 'tender_documents', 'meva_main_html', 'snapshots'), Date.now().toString()), {
        name, htmlContent: contentDiv.innerHTML, timestamp: Date.now(), createdBy: auth.currentUser.email
      });
      showToast("✅ Cloud Snapshot Created");
    } catch { showToast("❌ Backup Failed"); }
  };

  async function startApp() {
    setBlocked(true); await setPersistence(auth, browserLocalPersistence);
    onAuthStateChanged(auth, async (user) => {
      if (listenerUnsub) listenerUnsub();
      if (!user) { canSync = false; setBlocked(true); ensureLoginModal(); return; }
      if (!(await isAllowlistedEmail(user))) { await signOut(auth); return; }
      document.getElementById('meva-login-overlay')?.remove();
canSync = true;
setBlocked(false);

      listenerUnsub = onSnapshot(docRef, (snap) => {
        if (!snap.exists() || snap.metadata.hasPendingWrites) return;
        const data = snap.data();
        if (currentRev === 0 || !dirty) renderFromRemote(data.htmlContent, data.rev);
      });
    });
  }

  contentDiv.addEventListener('input', () => setDirty(true));
  startApp();

window.auth = auth;
window.db = db;
window.getDoc = getDoc;
window.doc = doc;
  window.setDoc = setDoc; // Ensure this is there
  window.serverTimestamp = serverTimestamp; // ADD THIS LINE
</script>

<script>
(function() {
  const contentDiv = document.getElementById('document-content');
  contentDiv.addEventListener('click', (e) => {
    if (!e.target.classList.contains('section-lock-btn')) return;
    const h = e.target.closest('.main-heading, .sub-heading'), locked = e.target.classList.toggle('is-locked');
    e.target.textContent = locked ? '🔒' : '✍️';
    let c = h.nextElementSibling;
    while (c && !['MAIN-HEADING','SUB-HEADING'].includes(c.className.toUpperCase())) {
      c.setAttribute('contenteditable', locked ? 'false' : 'true');
      c.classList.toggle('is-locked', locked);
      c = c.nextElementSibling;
    }
    window.setDirty?.(true);
  });
  function ensure() {
    contentDiv.querySelectorAll('.main-heading, .sub-heading').forEach(h => {
      if (h.querySelector('.section-lock-btn')) return;
      const b = document.createElement('span'); b.className = 'section-lock-btn';
      b.textContent = h.nextElementSibling?.getAttribute('contenteditable') === 'false' ? '🔒' : '✍️';
      h.appendChild(b);
    });
  }
  new MutationObserver(ensure).observe(contentDiv, { childList: true, subtree: true });
  ensure();
})();
</script>
  <script>
(function(){
  const root = document.getElementById('document-content');
  const toolbar = document.getElementById('meva-toolbar');
  if (!root || !toolbar) return;

  // ---------- helpers ----------
  function toast(msg){
    const t = document.getElementById('status-toast');
    if (!t) return alert(msg);
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=> t.style.display='none', 2200);
  }

  function inEditorSelection(){
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    const node = sel.anchorNode?.nodeType === 1 ? sel.anchorNode : sel.anchorNode?.parentElement;
    if (!node) return null;
    return root.contains(node) ? node : null;
  }

  function getCellFromSelection(){
    const node = inEditorSelection();
    if (!node) return null;
    return node.closest?.('td,th') || null;
  }

  function getCtx(){
    const cell = getCellFromSelection();
    if (!cell) return null;
    const row = cell.parentElement?.closest('tr');
    const table = cell.closest('table');
    if (!row || !table) return null;

    // Determine column index safely
    const colIndex = cell.cellIndex;

    // Determine max columns in this table by scanning rows
    let maxCols = 0;
    table.querySelectorAll('tr').forEach(tr => { maxCols = Math.max(maxCols, tr.children.length); });

    return { table, row, cell, colIndex, maxCols };
  }

  function makeCellLike(existingCell){
    const tag = existingCell?.tagName === 'TH' ? 'th' : 'td';
    const c = document.createElement(tag);
    c.innerHTML = '&nbsp;';
    return c;
  }

  // ---------- TEXT FORMATTING ----------
  function fmt(act){
    // Keep actions inside editor only
    if (!inEditorSelection()) return toast('Place cursor inside the document.');
    root.focus();

    // execCommand is the most compatible for contenteditable formatting
    if (act === 'bold') document.execCommand('bold');
    else if (act === 'italic') document.execCommand('italic');
    else if (act === 'underline') document.execCommand('underline');
    else if (act === 'ul') document.execCommand('insertUnorderedList');
    else if (act === 'ol') document.execCommand('insertOrderedList');
  else if (act === 'clear') document.execCommand('removeFormat');
    window.setDirty?.(true);
  }

  // ---------- TABLE OPS ----------
  function rowAbove(){
    const ctx = getCtx();
    if (!ctx) return toast('Place cursor inside a table cell.');
    const { row } = ctx;

    const newRow = document.createElement('tr');
    const cells = Array.from(row.children);
    if (!cells.length) return;

    cells.forEach(c => newRow.appendChild(makeCellLike(c)));
    row.parentNode.insertBefore(newRow, row);
    window.setDirty?.(true);
  }

  function rowBelow(){
    const ctx = getCtx();
    if (!ctx) return toast('Place cursor inside a table cell.');
    const { row } = ctx;

    const newRow = document.createElement('tr');
    const cells = Array.from(row.children);
    if (!cells.length) return;

    cells.forEach(c => newRow.appendChild(makeCellLike(c)));
    row.parentNode.insertBefore(newRow, row.nextSibling);
    window.setDirty?.(true);
  }

  function rowDel(){
    const ctx = getCtx();
    if (!ctx) return toast('Place cursor inside a table cell.');
    const { row, table } = ctx;

    const allRows = table.querySelectorAll('tbody tr, thead tr');
    if (allRows.length <= 1) return toast('Cannot delete the last row.');
    row.remove();
    window.setDirty?.(true);
  }

  function colLeft(){
    const ctx = getCtx();
    if (!ctx) return toast('Place cursor inside a table cell.');
    const { table, colIndex } = ctx;

    table.querySelectorAll('tr').forEach(tr => {
      // Only touch rows that have at least the target position
      const ref = tr.children[colIndex] || null;
      const newCell = makeCellLike(ref || tr.children[tr.children.length - 1]);
      tr.insertBefore(newCell, ref);
    });
    window.setDirty?.(true);
  }

  function colRight(){
    const ctx = getCtx();
    if (!ctx) return toast('Place cursor inside a table cell.');
    const { table, colIndex } = ctx;

    table.querySelectorAll('tr').forEach(tr => {
      const ref = tr.children[colIndex + 1] || null;
      const base = tr.children[colIndex] || tr.children[tr.children.length - 1];
      const newCell = makeCellLike(base);
      tr.insertBefore(newCell, ref);
    });
    window.setDirty?.(true);
  }

  function colDel(){
    const ctx = getCtx();
    if (!ctx) return toast('Place cursor inside a table cell.');
    const { table, colIndex } = ctx;

    // Guard: don't delete last column
    let minCols = Infinity;
    table.querySelectorAll('tr').forEach(tr => { minCols = Math.min(minCols, tr.children.length); });
    if (minCols <= 1) return toast('Cannot delete the last column.');

    table.querySelectorAll('tr').forEach(tr => {
      const cell = tr.children[colIndex];
      if (cell) cell.remove();
    });
    window.setDirty?.(true);
  }

  // ---------- DEEP DIVE ----------
  function deepDive(){
    const ctx = getCtx();
    if (!ctx) return toast('Place cursor inside a table cell.');
    const { row, maxCols } = ctx;

    const tr = document.createElement('tr');
    tr.className = 'deepdive-row';
    const td = document.createElement('td');
    td.colSpan = Math.max(1, maxCols);
    td.innerHTML = ''; // empty placeholder handled by CSS :empty:before
    td.setAttribute('contenteditable', 'true');
    tr.appendChild(td);

    row.parentNode.insertBefore(tr, row.nextSibling);

    // place caret inside deep dive cell
    td.focus();
    const r = document.createRange();
    r.selectNodeContents(td);
    r.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);

    window.setDirty?.(true);
  }
// ---------- TEXT COLOR (hook up UI) ----------
const colorBtn = document.getElementById('color-btn');
const colorPicker = document.getElementById('color-picker');

if (colorBtn && colorPicker) {
  colorBtn.onclick = () => colorPicker.click();

  colorPicker.oninput = function () {
    if (!inEditorSelection()) return toast('Place cursor inside the document.');
    root.focus();
    document.execCommand('foreColor', false, this.value);
    window.setDirty?.(true);
  };
}
  // ---------- dispatcher ----------
  toolbar.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    e.preventDefault();

    const act = btn.getAttribute('data-act');

    // text
    if (['bold','italic','underline','ul','ol','clear'].includes(act)) return fmt(act);

    // table
    if (act === 'row-above') return rowAbove();
    if (act === 'row-below') return rowBelow();
    if (act === 'row-del') return rowDel();
    if (act === 'col-left') return colLeft();
    if (act === 'col-right') return colRight();
    if (act === 'col-del') return colDel();
    if (act === 'deepdive') return deepDive();
  });

})();
</script>
