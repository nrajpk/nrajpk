<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MEVA Collaborative Tender System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Georama:wght@400;500;600;700;800&display=swap" rel="stylesheet">

 <style>
    :root {
      --brand-color: #e41837;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --bg-gray: #f9fafb;
    }

    @page { size: A4; margin: 16mm; }

    body {
      font-family: 'Georama', sans-serif;
      margin: 0;
      background: #374151;
      color: var(--text-main);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Base Typography & Badges */
    .vol-identifier {
      background: var(--brand-color);
      color: white;
      padding: 4px 12px;
      font-weight: 800;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .main-heading {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 15px;
      color: var(--text-main);
    }
    .sub-heading {
      font-size: 18px;
      font-weight: 700;
      color: var(--brand-color);
      border-bottom: 2px solid var(--brand-color);
      padding-bottom: 5px;
      margin: 20px 0 10px 0;
    }
    .group-header {
      background: #f3f4f6 !important;
      text-align: center;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 11px;
    }
    .col-exec-tbd {
      color: #9ca3af;
      font-style: italic;
      text-align: center;
    }

    /* Page Layouts */
    @media screen {
      .page {
        width: 210mm;
        min-height: 297mm;
        margin: 20px auto;
        background: #fff;
        padding: 16mm;
        box-sizing: border-box;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        position: relative;
        border-radius: 8px;
      }
    }

    @media print {
      .ui-controls, .doc-controls-wrapper, #remote-banner, #status-toast { display: none !important; }
      body { background: #fff; }
      .page { margin: 0; box-shadow: none; page-break-after: always; width: 100%; border-radius: 0; }
      .page:last-child { page-break-after: auto; }
    }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
    th, td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
    th { background: var(--bg-gray); font-weight: 800; color: var(--text-muted); font-size: 11px; }

    /* Header & Footer */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 10px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 60%;
    }
    .logo-container img {
      height: 26px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      display: block;
    }

    .page {
      position: relative;
      padding-bottom: 22mm; /* reserve footer space */
    }
    .page-footer {
      position: absolute;
      left: 16mm;
      right: 16mm;
      bottom: 12mm;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--border-color);
      padding-top: 6px;
    }
    .page-footer-text, .page-num {
      font-size: 9.5px;
      color: var(--text-muted);
      font-weight: 800;
      white-space: nowrap;
    }

    /* UI & Sync Controls */
    .ui-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 800;
      border: none;
      font-family: 'Georama', sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.2s;
    }
    .print-btn { background: white; color: var(--text-main); }
    .save-btn {
      background: var(--brand-color);
      color: #fff;
      display: none;
      position: fixed;
      right: 20px;
      top: 72px;
      z-index: 10000;
    }
    .save-btn.visible { display: inline-flex; align-items: center; gap: 8px; }

    #remote-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #fbbf24; color: #78350f;
      padding: 10px; text-align: center;
      font-weight: 800; display: none;
      z-index: 10001; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #remote-banner button {
      margin-left: 12px; padding: 6px 10px; cursor: pointer;
      font-weight: 800; border: none; border-radius: 6px;
    }
    #status-toast {
      position: fixed; bottom: 18px; left: 50%;
      transform: translateX(-50%); background: #111827; color: #fff;
      padding: 10px 16px; border-radius: 999px; font-size: 13px;
      z-index: 10002; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    /* ==========================================================================
       NEW ADDITIONS: SEED DATA SPECIFIC STYLING 
       ========================================================================== */

    /* Table of Contents (Index) */
    .toc-container { display: flex; flex-direction: column; gap: 8px; background: #f3f4f6; padding: 20px; border-radius: 6px; border: 1px solid var(--border-color); }
    .toc-link { font-weight: 800; color: var(--text-main); text-decoration: none; font-size: 14px; }
    .toc-sublink { font-weight: 600; color: var(--brand-color); text-decoration: none; font-size: 13px; margin-left: 15px; }
    .toc-divider { height: 1px; background: var(--border-color); margin: 10px 0; }
    .toc-link:hover, .toc-sublink:hover { text-decoration: underline; }

    /* Info Boxes */
    .info-box { padding: 12px 15px; border-left: 4px solid; border-radius: 4px; background: #f9fafb; font-size: 13px; margin: 15px 0; }
    .info-box.critical { border-left-color: var(--brand-color); background: #fef2f2; }
    .info-box.note { border-left-color: #3b82f6; background: #eff6ff; }

    /* Checklists */
    .check-list { margin: 0; padding-left: 20px; font-size: 13px; }
    .check-list li { margin-bottom: 4px; }

    /* Document Editing Controls */
    .doc-controls-wrapper { display: flex; gap: 8px; margin-top: 5px; margin-bottom: 15px; }
    .doc-control { background: #e5e7eb; border: 1px solid #d1d5db; padding: 4px 10px; font-size: 11px; cursor: pointer; border-radius: 4px; font-weight: 700; font-family: 'Georama', sans-serif; transition: 0.2s; }
    .doc-control:hover { background: #d1d5db; }

    /* Image Grids */
    .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .img-box { border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; text-align: center; }
    .img-title { font-weight: 800; font-size: 12px; margin-bottom: 5px; color: var(--brand-color); }
    .img-placeholder { border: 2px dashed #9ca3af; background: #f3f4f6; height: 180px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; position: relative; overflow: hidden; }
    .img-placeholder span { font-size: 11px; color: #6b7280; font-weight: 600; pointer-events: none; }
    .img-placeholder img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; background: #fff; }

    /* Certificates */
    .cert-placeholder { border: 2px dashed var(--border-color); padding: 50px 20px; text-align: center; border-radius: 8px; background: #f9fafb; color: var(--text-muted); margin-top: 20px; }
    .cert-placeholder svg { width: 48px; height: 48px; margin-bottom: 15px; color: #9ca3af; }
    .cert-placeholder h4 { margin: 0 0 10px 0; color: var(--text-main); }
    
    /* Signatures & Traceability */
    .sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .sig-box { border: 1px solid var(--border-color); border-radius: 8px; padding: 25px 15px 15px 15px; position: relative; }
    .sig-badge { position: absolute; top: -10px; left: 15px; background: var(--brand-color); color: white; padding: 2px 8px; font-size: 10px; font-weight: 800; border-radius: 4px; }
    .sig-line { margin-top: 25px; font-size: 13px; line-height: 1.8; font-weight: 600; }
    .small { font-size: 11px; }
    .trace { font-size: 13px; padding: 10px; border: 1px solid var(--border-color); background: #f9fafb; border-radius: 4px; margin-bottom: 20px; display: flex; justify-content: space-between; }
  </style>
</head>

<body>

<div id="remote-banner">
  ⚠️ Someone else saved a newer version while you were editing.
  <button id="btn-accept-remote" type="button">Load latest</button>
  <button id="btn-keep-mine" type="button">Keep mine</button>
</div>

<div id="status-toast"></div>

<div class="ui-controls">
  <button class="btn print-btn" onclick="window.print()">🖨️ Print PDF</button>
</div>

<button class="btn save-btn" id="save-btn" type="button" onclick="saveData()">☁️ Sync to Cloud</button>

<div id="document-content" contenteditable="true" spellcheck="false"></div>

<script type="module">
  import { defaultHTML } from './seed-data.js';

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import {
    getFirestore,
    doc,
    onSnapshot,
    runTransaction,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCKKlwTf9Jgh94j2tRZyP-qPNuArdyT1bc",
    authDomain: "brazil-tender.firebaseapp.com",
    projectId: "brazil-tender",
    storageBucket: "brazil-tender.firebasestorage.app",
    messagingSenderId: "844067669814",
    appId: "1:844067669814:web:8c1b4f84ce7b5c62cbd597"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const docRef = doc(db, 'tender_documents', 'meva_main_html');

  const contentDiv = document.getElementById('document-content');
  const saveBtn = document.getElementById('save-btn');
  const remoteBanner = document.getElementById('remote-banner');
  const btnAcceptRemote = document.getElementById('btn-accept-remote');
  const btnKeepMine = document.getElementById('btn-keep-mine');
  const toast = document.getElementById('status-toast');

  let currentRev = 0;         // last applied cloud revision
  let remotePending = null;   // { html, rev }
  let dirty = false;          // local edits not yet synced
  let applyingRemote = false; // guard for snapshot apply
  let seededOnce = false;     // avoid repeated seed attempts

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2200);
  }

  function setDirty(isDirty) {
    dirty = isDirty;
    if (dirty) saveBtn.classList.add('visible');
    else saveBtn.classList.remove('visible');
  }

  function positionSaveNearCaret() {
    if (!dirty) return;

    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) {
      saveBtn.style.top = '72px';
      return;
    }

    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();

    // Fallback for tables and ambiguous selections
    if (!rect || (rect.top === 0 && rect.left === 0 && rect.width === 0 && rect.height === 0)) {
      saveBtn.style.top = '72px';
      return;
    }

    const top = Math.max(80, rect.top + window.scrollY - 10);
    saveBtn.style.top = `${top}px`;
  }

  async function seedCloudIfMissing() {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(docRef);
      if (snap.exists()) return;
      tx.set(docRef, {
        htmlContent: defaultHTML,
        rev: 1,
        updatedAt: serverTimestamp()
      });
    });
  }

  function startRealtimeListener() {
    onSnapshot(docRef, { includeMetadataChanges: true }, async (snap) => {
      // Ignore our own local pending writes
      if (snap.metadata.hasPendingWrites) return;

      // If doc missing, seed from here (single source of truth)
      if (!snap.exists()) {
        if (!seededOnce) {
          seededOnce = true;

          // Show something immediately so team is not staring at blank
          applyingRemote = true;
          contentDiv.innerHTML = defaultHTML;
          applyingRemote = false;
          currentRev = 0;
          setDirty(true);
          window.updatePageNumbers();
          showToast('Seeding cloud...');

          try {
            await seedCloudIfMissing();
          } catch (e) {
            console.error('Seed failed:', e);
            showToast('Seed failed. Check Firestore rules.');
          }
        }
        return;
      }

      const data = snap.data() || {};
      const nextRev = Number(data.rev || 0);
      const nextHTML = String(data.htmlContent || '');

      // First load
      if (currentRev === 0) {
        applyingRemote = true;
        contentDiv.innerHTML = nextHTML;
        applyingRemote = false;

        currentRev = nextRev;
        setDirty(false);
        remoteBanner.style.display = 'none';
        remotePending = null;
        window.updatePageNumbers();
        return;
      }

      // Remote is newer
      if (nextRev > currentRev) {
        if (dirty) {
          remotePending = { html: nextHTML, rev: nextRev };
          remoteBanner.style.display = 'block';
          return;
        }

        applyingRemote = true;
        contentDiv.innerHTML = nextHTML;
        applyingRemote = false;

        currentRev = nextRev;
        window.updatePageNumbers();
        showToast('Updated from cloud');
      }
    }, (err) => {
      console.error('Snapshot error:', err);
      showToast('Live sync error. Check rules or network.');
    });
  }

  window.saveData = async () => {
    if (!dirty) return;

    saveBtn.textContent = '⏳ Syncing...';
    saveBtn.disabled = true;

    try {
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(docRef);

        if (!snap.exists()) {
          tx.set(docRef, { htmlContent: contentDiv.innerHTML, rev: 1, updatedAt: serverTimestamp() });
          currentRev = 1;
          return;
        }

        const serverRev = Number(snap.data().rev || 0);

        if (serverRev !== currentRev) {
          throw new Error('REV_CONFLICT');
        }

        const newRev = serverRev + 1;
        tx.update(docRef, {
          htmlContent: contentDiv.innerHTML,
          rev: newRev,
          updatedAt: serverTimestamp()
        });

        currentRev = newRev;
      });

      setDirty(false);
      remoteBanner.style.display = 'none';
      remotePending = null;
      showToast('Synced');

    } catch (e) {
      console.error('Sync failed:', e);

      if (String(e.message || '').includes('REV_CONFLICT')) {
        showToast('Conflict. Load latest or keep yours.');
        remoteBanner.style.display = 'block';
      } else {
        showToast('Sync failed. Check permissions.');
      }

    } finally {
      saveBtn.textContent = '☁️ Sync to Cloud';
      saveBtn.disabled = false;
    }
  };// --- BULLETPROOF WORD-DOC FUNCTIONALITIES ---
  
  // Helper: Search backwards past hidden breaks/divs to find the table
  function getNearestTable(wrapper) {
    let el = wrapper.previousElementSibling;
    while (el && el.tagName !== 'TABLE') {
      el = el.previousElementSibling;
    }
    return el;
  }

  // Table Rows
  window.addRow = function(btn) {
    console.log("Add Row triggered");
    const table = getNearestTable(btn.closest('.doc-controls-wrapper'));
    if (!table) return;
    
    const tbody = table.querySelector('tbody');
    if (!tbody || !tbody.lastElementChild) return;
    
    const newRow = tbody.lastElementChild.cloneNode(true);
    newRow.querySelectorAll('td').forEach(td => td.innerHTML = ''); // Clear text
    tbody.appendChild(newRow);
    
    setDirty(true);
    positionSaveNearCaret();
  };

  window.removeRow = function(btn) {
    const table = getNearestTable(btn.closest('.doc-controls-wrapper'));
    if (!table) return;
    const tbody = table.querySelector('tbody');
    if (tbody && tbody.children.length > 1) {
      tbody.removeChild(tbody.lastElementChild);
      setDirty(true);
      positionSaveNearCaret();
    }
  };

  // Table Columns
  window.addCol = function(btn) {
    const table = getNearestTable(btn.closest('.doc-controls-wrapper'));
    if (!table) return;
    
    const theadTr = table.querySelector('thead tr');
    if (theadTr) {
      const newTh = document.createElement('th');
      newTh.innerText = 'New Col';
      theadTr.appendChild(newTh);
    }
    
    table.querySelectorAll('tbody tr').forEach(tr => {
      const newTd = document.createElement('td');
      tr.appendChild(newTd);
    });
    
    setDirty(true);
    positionSaveNearCaret();
  };

  window.removeCol = function(btn) {
    const table = getNearestTable(btn.closest('.doc-controls-wrapper'));
    if (!table) return;
    
    const theadTr = table.querySelector('thead tr');
    if (theadTr && theadTr.children.length > 1) {
      theadTr.removeChild(theadTr.lastElementChild);
    }
    
    table.querySelectorAll('tbody tr').forEach(tr => {
      if (tr.children.length > 1) {
        tr.removeChild(tr.lastElementChild);
      }
    });
    
    setDirty(true);
    positionSaveNearCaret();
  };

  // Image Prompts & Addition
  window.promptImage = function(placeholderElement) {
    const url = prompt('Enter the secure URL of the image to insert (e.g., https://...):');
    if (url) {
      const img = placeholderElement.querySelector('img');
      const span = placeholderElement.querySelector('span');
      if(img) { img.src = url; img.style.display = 'block'; }
      if(span) span.style.display = 'none';
      setDirty(true);
    }
  };

  window.addImageBox = function(btn) {
    let grid = btn.closest('.doc-controls-wrapper').previousElementSibling;
    // Scan backwards for the image grid
    while (grid && !grid.classList.contains('img-grid')) {
      grid = grid.previousElementSibling;
    }
    if (!grid) return;

    const newBox = grid.firstElementChild.cloneNode(true);
    
    const img = newBox.querySelector('img');
    if (img) { img.src = ''; img.style.display = 'none'; }
    
    const span = newBox.querySelector('span');
    if (span) span.style.display = 'block';
    
    const title = newBox.querySelector('.img-title');
    if(title) title.innerText = 'New Image Section';
    
    const desc = newBox.querySelector('p.para');
    if(desc) desc.innerText = 'Description...';
    
    grid.appendChild(newBox);
    setDirty(true);
    positionSaveNearCaret();
  };

  // Certificate Pagination
  window.addCertificate = function(btn) {
    const page = btn.closest('.page');
    if (!page) return;
    const newPage = page.cloneNode(true);
    
    const title = newPage.querySelector('.cert-title');
    if(title) title.innerText = 'Annex: [New Document]';
    
    const h4 = newPage.querySelector('.cert-placeholder h4');
    if(h4) h4.innerText = 'Attach Document: [Name]';
    
    page.parentNode.insertBefore(newPage, page.nextSibling);
    
    if (typeof window.updatePageNumbers === 'function') {
      window.updatePageNumbers();
    }
    
    setDirty(true);
    positionSaveNearCaret();
  };
  // ⬆️ END OF PASTED JAVASCRIPT SNIPPET ⬆️
  contentDiv.addEventListener('input', () => {
    if (applyingRemote) return;
    setDirty(true);
    positionSaveNearCaret();
  });

  contentDiv.addEventListener('keyup', positionSaveNearCaret);
  contentDiv.addEventListener('mouseup', positionSaveNearCaret);

  btnAcceptRemote.addEventListener('click', () => {
    if (!remotePending) {
      remoteBanner.style.display = 'none';
      return;
    }

    applyingRemote = true;
    contentDiv.innerHTML = remotePending.html;
    applyingRemote = false;

    currentRev = remotePending.rev;
    remotePending = null;
    remoteBanner.style.display = 'none';
    setDirty(false);
    window.updatePageNumbers();
    showToast('Loaded latest');
  });

  btnKeepMine.addEventListener('click', () => {
    remoteBanner.style.display = 'none';
    showToast('Keeping local edits');
  });

  async function startApp() {
    // No top-level await. Fail gracefully.
    try {
      await signInAnonymously(auth);
    } catch (e) {
      console.error('Anonymous auth failed:', e);

      // Still show local seed so team can work visually
      applyingRemote = true;
      contentDiv.innerHTML = defaultHTML;
      applyingRemote = false;

      setDirty(true);
      window.updatePageNumbers();
      showToast('Auth failed. Check Firebase Auth and Firestore rules.');
      return;
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) return;
      startRealtimeListener();
    });
  }

  startApp();
</script>

<script>
  window.updatePageNumbers = () => {
    const pages = document.querySelectorAll('.page');
    pages.forEach((p, i) => {
      const numEl = p.querySelector('.page-num');
      if (numEl) numEl.innerText = `Page ${i + 1} of ${pages.length}`;
    });
  };
</script>

</body>
</html>
