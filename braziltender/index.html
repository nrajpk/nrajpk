<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MEVA Collaborative Tender System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Georama:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- STYLE IS INTENTIONALLY MINIMAL (we’ll add your full CSS later) -->
  <style>
    :root {
      --brand-color: #E41837;
      --text-main: #1A1A1B;
      --text-muted: #5F6368;
      --border-color: #DADCE0;
      --bg-gray: #F8F9FA;
      --app-bg: #1f2937;
    }
    body {
      font-family: 'Georama', sans-serif;
      margin: 0;
      padding-top: 60px;
      background: var(--app-bg);
      color: var(--text-main);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .app-toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }
    .app-brand { font-size: 16px; font-weight: 800; display:flex; gap:10px; align-items:center; }
    .app-brand span { color: var(--brand-color); }
    .toolbar-actions { display:flex; gap:12px; align-items:center; }
    .btn {
      background: #fff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      font-family: 'Georama', sans-serif;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-primary { background: var(--brand-color); color:#fff; border-color: var(--brand-color); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    #status-toast {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%);
      background: #1A1A1B;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      z-index: 2000;
      display: none;
    }

    /* document area */
    #document-content { outline: none; min-height: calc(100vh - 90px); padding: 16px; background: #fff; margin: 16px auto; max-width: 1100px; border-radius: 8px; }

    /* section lock button minimal */
    .section-lock-btn { cursor:pointer; margin-left:10px; font-size:10px; opacity:0.6; padding:2px 8px; border-radius:10px; border:1px solid #ccc; font-weight: 800; user-select:none; }
    .section-lock-btn.is-locked { opacity:1; color:var(--brand-color); background:#fff0f1; border-color:var(--brand-color); }
  </style>
</head>

<body>
  <div class="app-toolbar">
    <div class="app-brand">MEVA <span>Tender Builder</span></div>
    <div class="toolbar-actions">
      <span id="sync-status" style="font-size:12px; font-weight:600; color:var(--text-muted);">Status: Ready</span>
      <button class="btn" onclick="window.takeSnapshot()">📸 Snapshot</button>
      <button class="btn" onclick="window.print()">🖨️ PDF</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveData()" disabled>☁️ Sync to Cloud</button>
    </div>
  </div>

  <div id="status-toast"></div>
  <div id="document-content" contenteditable="true" spellcheck="false"></div>

  <script type="module">
    // Fallback ONLY (does not overwrite Firestore)
    const MEVA_SKELETON = `
      <div class="page">
        <div class="page-content">
          <div class="main-heading">Document loading...</div>
          <p style="color:#5F6368">If this stays here, your Firestore doc may be empty or access is blocked.</p>
        </div>
      </div>
    `;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      onSnapshot,
      runTransaction,
      serverTimestamp,
      collection
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAnkigLELyqqE8yHMrTF2RZ0IxbCoRhpAk",
      authDomain: "brazil-tender-6d171.firebaseapp.com",
      projectId: "brazil-tender-6d171",
      storageBucket: "brazil-tender-6d171.firebasestorage.app",
      messagingSenderId: "645077728018",
      appId: "1:645077728018:web:13a6fe63f85442e35e91cb",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const docRef = doc(db, "tender_documents", "meva_main_html");

    const contentDiv = document.getElementById("document-content");
    const saveBtn = document.getElementById("save-btn");
    const syncStatus = document.getElementById("sync-status");

    let currentRev = 0;
    let dirty = false;
    let applyingRemote = false;
    let canSync = false;
    let listenerUnsub = null;

    function showToast(msg) {
      const t = document.getElementById("status-toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => (t.style.display = "none"), 2500);
    }

    function setDirty(isDirty) {
      if (applyingRemote) return;
      dirty = isDirty;
      syncStatus.textContent = dirty ? "Unsaved changes" : "All changes saved";
      saveBtn.disabled = !canSync || !dirty;
    }

    function renderFromRemote(html, rev) {
      applyingRemote = true;

      if (!html || String(html).trim() === "") {
        // show fallback only; DO NOT seed / overwrite Firestore
        contentDiv.innerHTML = MEVA_SKELETON;
      } else {
        contentDiv.innerHTML = html;
      }

      applyingRemote = false;
      currentRev = Number(rev || 0);
      setDirty(false);
    }

    function setBlocked(blocked) {
      contentDiv.setAttribute("contenteditable", blocked ? "false" : "true");
      contentDiv.style.pointerEvents = blocked ? "none" : "auto";
      contentDiv.style.opacity = blocked ? "0.5" : "1";
    }

    async function isAllowlistedEmail(user) {
      if (!user?.email) return false;
      const snap = await getDoc(doc(db, "allowlist_emails", user.email));
      return snap.exists() && snap.data()?.enabled === true;
    }

    function ensureLoginModal() {
      if (document.getElementById("meva-login-overlay")) return;

      const overlay = document.createElement("div");
      overlay.id = "meva-login-overlay";
      overlay.style.cssText =
        "position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; font-family:Georama, sans-serif;";

      overlay.innerHTML = `
        <div style="width:380px; background:#fff; border-radius:10px; padding:25px; box-shadow:0 10px 40px rgba(0,0,0,0.5);">
          <div style="font-weight:900; color:var(--brand-color); margin-bottom:15px; text-align:center;">MEVA SECURE LOGIN</div>
          <input id="m-email" type="email" placeholder="Email" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
          <input id="m-pass" type="password" placeholder="Password" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
          <button id="m-btn" style="width:100%; padding:12px; background:var(--brand-color); color:#fff; border:none; border-radius:6px; font-weight:800; cursor:pointer;">SIGN IN</button>
          <div id="m-msg" style="color:red; font-size:11px; margin-top:10px; text-align:center;"></div>
        </div>
      `;
      document.body.appendChild(overlay);

      overlay.querySelector("#m-btn").onclick = async () => {
        const e = document.getElementById("m-email").value;
        const p = document.getElementById("m-pass").value;
        try {
          await signInWithEmailAndPassword(auth, e, p);
        } catch {
          document.getElementById("m-msg").textContent = "Access Denied.";
        }
      };
    }

    // Save keeps your “team editing + conflict safety”
    window.saveData = async () => {
      if (!canSync || !dirty) return;
      saveBtn.textContent = "⏳ Syncing...";

      try {
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(docRef);
          const sRev = snap.exists() ? Number(snap.data().rev || 0) : 0;

          // If remote changed since you loaded, block overwrite
          if (sRev !== currentRev) throw new Error("CONFLICT");

          tx.set(docRef, {
            htmlContent: contentDiv.innerHTML,
            rev: sRev + 1,
            updatedAt: serverTimestamp(),
            updatedBy: auth.currentUser.email,
          });

          currentRev = sRev + 1;
        });

        setDirty(false);
        showToast("☁️ Saved");
      } catch {
        showToast("Sync Conflict! Please reload.");
      } finally {
        saveBtn.textContent = "☁️ Sync to Cloud";
      }
    };

    window.takeSnapshot = async () => {
      const name = prompt("Milestone Name:");
      if (!name) return;

      try {
        await setDoc(
          doc(collection(db, "tender_documents", "meva_main_html", "snapshots"), Date.now().toString()),
          {
            name,
            htmlContent: contentDiv.innerHTML,
            timestamp: Date.now(),
            createdBy: auth.currentUser.email,
          }
        );
        showToast("✅ Cloud Snapshot Created");
      } catch {
        showToast("❌ Backup Failed");
      }
    };

    async function startApp() {
      setBlocked(true);
      contentDiv.innerHTML = MEVA_SKELETON;

      await setPersistence(auth, browserLocalPersistence);

      onAuthStateChanged(auth, async (user) => {
        if (listenerUnsub) listenerUnsub();

        if (!user) {
          canSync = false;
          setBlocked(true);
          ensureLoginModal();
          return;
        }

        if (!(await isAllowlistedEmail(user))) {
          await signOut(auth);
          return;
        }

        document.getElementById("meva-login-overlay")?.remove();
        canSync = true;
        setBlocked(false);
        saveBtn.disabled = !dirty;

        listenerUnsub = onSnapshot(docRef, (snap) => {
          if (snap.metadata.hasPendingWrites) return;

          // IMPORTANT: we are NOT seeding. Only loading.
          if (!snap.exists()) {
            renderFromRemote("", 0);
            showToast("No Firestore doc found. Ask admin to restore backup.");
            return;
          }

          const data = snap.data();
          if (currentRev === 0 || !dirty) {
            renderFromRemote(data.htmlContent, data.rev);
          }
        });
      });
    }

    contentDiv.addEventListener("input", () => setDirty(true));
    startApp();

    // expose for your other scripts if needed
    window.setDirty = setDirty;
  </script>

  <!-- Section Lock Script (kept) -->
  <script>
    (function () {
      const contentDiv = document.getElementById("document-content");

      contentDiv.addEventListener("click", (e) => {
        if (!e.target.classList.contains("section-lock-btn")) return;

        const h = e.target.closest(".main-heading, .sub-heading");
        if (!h) return;

        const locked = e.target.classList.toggle("is-locked");
        e.target.textContent = locked ? "🔒 Locked" : "🔓 Unlocked";

        let c = h.nextElementSibling;
        while (c && !c.classList?.contains("main-heading") && !c.classList?.contains("sub-heading")) {
          c.setAttribute("contenteditable", locked ? "false" : "true");
          c = c.nextElementSibling;
        }

        if (window.setDirty) window.setDirty(true);
      });

      function ensureButtons() {
        contentDiv.querySelectorAll(".main-heading, .sub-heading").forEach((h) => {
          if (h.querySelector(".section-lock-btn")) return;
          const b = document.createElement("span");
          b.className = "section-lock-btn";
          b.textContent = "🔓 Unlocked";
          h.appendChild(b);
        });
      }

      new MutationObserver(ensureButtons).observe(contentDiv, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
